[project]
name = "shadetree-ai-plugins"
version = "0.0.0"
description = "uv workspace root + Claude Code/Desktop/Cowork plugin marketplace for shadetree-ai-plugins solutions."
# The <3.14 ceiling is inherited, not chosen: plugins/audiobook-creator depends
# on kokoro-onnx, which declares `<3.14,>=3.10`. A workspace lock resolves to
# the intersection of its members, so the cap lands here whether or not it's
# written down — stating it explicitly keeps `uv lock` from producing a
# surprising repo-wide diff. Lift it when kokoro-onnx supports 3.14.
requires-python = ">=3.12,<3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "plugins/*"]
exclude = [                         # skills-only plugins, one line each
    "plugins/grilling",
    "plugins/handoff",
    "plugins/meeting-recap",
]

[dependency-groups]
dev = [
    "fastmcp>=3.4",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["packages", "plugins"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["plugins/*/src/shadetree_ai_plugins_common"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
