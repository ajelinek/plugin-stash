[project]
name = "shadetree-ai-plugins-email-domain-reputation"
version = "0.1.0"
description = "Local email reputation investigation and DNS mail-authentication audits with OS-keychain credentials."
requires-python = ">=3.12"
dependencies = ["fastmcp>=3.4", "keyring>=25.5.0", "dnspython>=2.7,<3"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["shadetree_ai_plugins_email_domain_reputation", "shadetree_ai_plugins_common"]
